services:
  - type: web
    name: ems-backend-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health

    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      - key: ConnectionStrings__DefaultConnection
        sync: false

      - key: Jwt__Key
        sync: false

      - key: Jwt__Issuer
        value: EMS.API

      - key: Jwt__Audience
        value: EMS.Client

      - key: Jwt__ExpiryMinutes
        value: 1440
